<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - SyntraAid Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Poppins','system-ui','sans-serif']},colors:{brand:{green:'#2BB673',darkgreen:'#22A05B',lightgreen:'#F2FBF6'}}}}}</script>
  <style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');body{background:#f8f9fa;color:#111827;font-family:'Poppins',sans-serif}.fi{width:100%;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px 14px;font-size:13px}.fi:focus{outline:none;border-color:#2BB673;box-shadow:0 0 0 3px rgba(43,182,115,.12)}</style>
</head>
<body class="antialiased">
  <div id="app"></div>
  <script src="js/config.js"></script><script src="js/auth.js"></script>
  <script src="js/api.js"></script><script src="js/layout.js"></script>
  <script>
    const content = `
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100"><p class="text-[12px] text-gray-500">Total Projects</p><p class="text-[22px] font-[800]" id="k-proj">--</p></div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100"><p class="text-[12px] text-gray-500">Volunteers</p><p class="text-[22px] font-[800]" id="k-vol">--</p></div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100"><p class="text-[12px] text-gray-500">Hours Logged</p><p class="text-[22px] font-[800]" id="k-hrs">--</p></div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100"><p class="text-[12px] text-gray-500">Task Completion</p><p class="text-[22px] font-[800]" id="k-rate">--</p></div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
        <div class="lg:col-span-1 bg-white rounded-2xl p-6 shadow-sm border border-gray-100 space-y-4">
          <h2 class="text-[15px] font-[700]">Generate Report</h2>
          <div id="okBox" class="hidden rounded-xl bg-[#E8F8F0] text-brand-darkgreen px-4 py-3 text-[13px]"></div>
          <div id="errBox" class="hidden rounded-xl bg-red-50 text-red-700 px-4 py-3 text-[13px]"></div>
          <div>
            <label class="block text-[13px] font-[700] mb-1.5">Report Type</label>
            <select id="reportType" class="fi">
              <option value="impact_report">Impact Report</option>
              <option value="attendance_export">Attendance Export</option>
              <option value="kpi_summary">KPI Summary</option>
            </select>
          </div>
          <div><label class="block text-[13px] font-[700] mb-1.5">Format</label>
            <select id="format" class="fi"><option value="pdf">PDF</option><option value="csv">CSV</option></select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="block text-[12px] font-[600] mb-1">From</label><input id="from" type="date" class="fi"></div>
            <div><label class="block text-[12px] font-[600] mb-1">To</label><input id="to" type="date" class="fi"></div>
          </div>
          <button id="genBtn" type="button" class="w-full py-3 rounded-full bg-brand-green text-white text-[14px] font-[700] hover:bg-brand-darkgreen transition-colors">Generate &amp; Download</button>
        </div>

        <div class="lg:col-span-2 bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
          <h2 class="text-[15px] font-[700] mb-4">Report History</h2>
          <div class="overflow-x-auto">
            <table class="w-full text-[13px]">
              <thead><tr class="text-left text-gray-400 border-b border-gray-100"><th class="py-2 font-[600]">Type</th><th class="py-2 font-[600]">Generated</th><th class="py-2 font-[600]">Range</th></tr></thead>
              <tbody id="histRows"><tr><td colspan="3" class="py-3 text-gray-400">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    `;
    Layout.render({ role:"admin", active:"reports", title:"Reports", subtitle:"Generate and review impact reports.", content });

    const ok=Layout.el('okBox'),err=Layout.el('errBox');

    (async function kpis(){
      try{const res=await window.Api.get("/reports/kpis");const d=res.data||{};
        Layout.el('k-proj').textContent=d.totalProjects??0;
        Layout.el('k-vol').textContent=d.totalVolunteers??0;
        Layout.el('k-hrs').textContent=(d.totalHoursLogged??0)+'h';
        Layout.el('k-rate').textContent=(typeof d.taskCompletionRate==='string')?d.taskCompletionRate:((d.taskCompletionRate??0)+'%');
      }catch(e){}
    })();

    async function loadHistory(){
      try{const res=await window.Api.get("/reports");const list=res.data||[];const rows=Layout.el('histRows');
        if(!list.length){rows.innerHTML='<tr><td colspan="3" class="py-3 text-gray-400">No reports generated yet.</td></tr>';return;}
        rows.innerHTML=list.map(r=>'<tr class="border-b border-gray-50"><td class="py-2.5 capitalize">'+Layout.esc((r.reportType||'').replace(/_/g,' '))+'</td><td class="py-2.5 text-gray-500">'+new Date(r.generatedAt).toLocaleString()+'</td><td class="py-2.5 text-gray-500">'+(r.dateRangeStart?new Date(r.dateRangeStart).toLocaleDateString():'all')+' - '+(r.dateRangeEnd?new Date(r.dateRangeEnd).toLocaleDateString():'now')+'</td></tr>').join('');
      }catch(e){Layout.el('histRows').innerHTML='<tr><td colspan="3" class="py-3 text-red-500">'+Layout.esc(e.message)+'</td></tr>';}
    }
    loadHistory();

    Layout.el('genBtn').addEventListener('click', async ()=>{
      ok.classList.add('hidden');err.classList.add('hidden');
      const reportType=Layout.el('reportType').value;
      const format=Layout.el('format').value;
      const from=Layout.el('from').value, to=Layout.el('to').value;
      const btn=Layout.el('genBtn');btn.disabled=true;const t=btn.textContent;btn.textContent='Generating...';
      try{
        // The generate endpoint streams a file; fetch as blob with token
        const body={reportType,format}; if(from)body.dateRangeStart=from; if(to)body.dateRangeEnd=to;
        const res=await fetch(window.API_BASE+"/reports/generate",{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+window.Auth.getToken()},body:JSON.stringify(body)});
        if(!res.ok){const j=await res.json().catch(()=>({}));throw new Error(j.message||'Generation failed');}
        const blob=await res.blob();
        const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=reportType+'.'+format;a.click();
        ok.textContent='Report generated and downloaded.';ok.classList.remove('hidden');
        loadHistory();
      }catch(e){err.textContent=e.message||'Could not generate report.';err.classList.remove('hidden');}
      finally{btn.disabled=false;btn.textContent=t;}
    });
  </script>
</body>
</html>
