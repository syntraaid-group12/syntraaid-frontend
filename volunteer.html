<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volunteer Dashboard - SyntraAid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Poppins','system-ui','sans-serif']},colors:{brand:{green:'#2BB673',darkgreen:'#22A05B',lightgreen:'#F2FBF6'}}}}}</script>
  <style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');body{background:#f8f9fa;color:#111827;font-family:'Poppins',sans-serif}::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9999px}</style>
</head>
<body class="antialiased">
  <div id="app"></div>
  <script src="js/config.js"></script><script src="js/auth.js"></script>
  <script src="js/api.js"></script><script src="js/layout.js"></script>
  <script>
    const content = `
      <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-gray-100 flex items-center gap-4">
          <div class="w-11 h-11 rounded-full bg-[#E8F8F0] flex items-center justify-center shrink-0"><svg class="w-5 h-5 text-brand-green" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>
          <div><p class="text-[12px] text-gray-500 font-[500]">Hours Logged</p><p class="text-[22px] font-[800]" id="k-hours">--</p></div>
        </div>
        <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-gray-100 flex items-center gap-4">
          <div class="w-11 h-11 rounded-full bg-purple-50 flex items-center justify-center shrink-0"><svg class="w-5 h-5 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4"></path></svg></div>
          <div><p class="text-[12px] text-gray-500 font-[500]">Tasks Completed</p><p class="text-[22px] font-[800]" id="k-done">--</p></div>
        </div>
        <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-gray-100 flex items-center gap-4">
          <div class="w-11 h-11 rounded-full bg-amber-50 flex items-center justify-center shrink-0"><svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"></path></svg></div>
          <div><p class="text-[12px] text-gray-500 font-[500]">Open Tasks</p><p class="text-[22px] font-[800]" id="k-open">--</p></div>
        </div>
        <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-gray-100 flex items-center gap-4">
          <div class="w-11 h-11 rounded-full bg-blue-50 flex items-center justify-center shrink-0"><svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg></div>
          <div><p class="text-[12px] text-gray-500 font-[500]">Projects Joined</p><p class="text-[22px] font-[800]" id="k-projects">--</p></div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
          <div class="flex items-center justify-between mb-4"><h2 class="text-[16px] font-[700]">My Tasks</h2><a href="volunteer-tasks.html" class="text-[12px] text-brand-green font-[700]">View All</a></div>
          <div id="tasks-list" class="space-y-2"><p class="text-[13px] text-gray-400">Loading...</p></div>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
          <div class="flex items-center justify-between mb-4"><h2 class="text-[16px] font-[700]">My Projects</h2></div>
          <div id="projects-list" class="space-y-2"><p class="text-[13px] text-gray-400">Loading...</p></div>
        </div>
      </div>
    `;
    Layout.render({ role:"volunteer", active:"dashboard", title:"Welcome Back", subtitle:"Your tasks, hours and projects.", content });

    const user=window.Auth.getUser()||{};
    const BADGE={not_started:'bg-gray-100 text-gray-500',in_progress:'bg-blue-50 text-blue-600',blocked:'bg-amber-50 text-amber-600',completed:'bg-[#E8F8F0] text-brand-green'};

    (async function(){
      try{
        const res=await window.Api.get("/volunteers/"+user._id+"/dashboard");
        const d=res.data||{};
        Layout.el('k-hours').textContent=(d.totalHoursLogged||0)+'h';
        Layout.el('k-projects').textContent=(d.projects||[]).length;
        const up=d.upcomingTasks||[];
        Layout.el('k-open').textContent=up.length;
        // tasks completed: fetch full task list for accurate count
        let done=0;
        try{const t=await window.Api.get("/volunteers/"+user._id+"/tasks");done=(t.data||[]).filter(x=>x.status==='completed').length;}catch(e){}
        Layout.el('k-done').textContent=done;

        const tl=Layout.el('tasks-list');
        tl.innerHTML=up.length?up.map(t=>'<a href="volunteer-task-detail.html?id='+t._id+'" class="flex items-center justify-between border border-gray-100 rounded-xl px-4 py-2.5 hover:bg-gray-50"><div class="min-w-0"><p class="text-[13px] font-[600] text-gray-800 truncate">'+Layout.esc(t.title)+'</p><p class="text-[11px] text-gray-400">'+(t.dueDate?('Due '+new Date(t.dueDate).toLocaleDateString()):'No due date')+'</p></div><span class="text-[10px] px-2 py-0.5 rounded-full '+(BADGE[t.status]||'')+' capitalize shrink-0">'+(t.status||'').replace(/_/g,' ')+'</span></a>').join(''):'<p class="text-[13px] text-gray-400">No open tasks.</p>';

        const pl=Layout.el('projects-list');
        const projects=d.projects||[];
        pl.innerHTML=projects.length?projects.map(p=>'<a href="volunteer-project-overview.html?id='+p._id+'" class="flex items-center justify-between border border-gray-100 rounded-xl px-4 py-2.5 hover:bg-gray-50"><span class="text-[13px] font-[600] text-gray-800">'+Layout.esc(p.title)+'</span><span class="text-[11px] text-gray-400 capitalize">'+(p.status||'').replace(/_/g,' ')+'</span></a>').join(''):'<p class="text-[13px] text-gray-400">No projects yet.</p>';
      }catch(e){
        Layout.el('tasks-list').innerHTML='<p class="text-[13px] text-red-500">'+Layout.esc(e.message)+'</p>';
      }
    })();
  </script>
</body>
</html>
