<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - SyntraAid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>

<body class="h-screen w-full bg-[#f8faf8] overflow-hidden">

  <div class="flex flex-col md:flex-row h-screen w-full">

    <div class="hidden md:block relative md:w-[50%] lg:w-[52%] h-full flex-shrink-0">

      <div class="absolute inset-0 rounded-br-[40px] rounded-tr-[40px] overflow-hidden">
        <img src="./images/side intro.jpg" alt="SyntraAid Onboarding" class="w-full h-full object-cover">
      </div>

      <div class="absolute bottom-12 left-8 md:left-10 z-10 max-w-[90%] md:max-w-[420px] pr-4">
        <h1 class="text-black text-[36px] md:text-[44px] font-[900] leading-[1.1] mb-4">
          Syntra<span class="text-[#2BB673]">Aid</span> Manage Impact.<br>Inspire Change.
        </h1>
        <p class="text-black text-[14px] md:text-[15px] font-[700] leading-snug">
          Coordinate volunteers, oversee projects, track contributions, and support
          transparent community impact — all in one platform.
        </p>
      </div>

    </div>

    <div class="flex-1 h-full bg-[#f8faf8] relative flex flex-col items-center justify-center overflow-hidden">
      <div class="absolute bottom-0 right-0 w-full h-64 opacity-20 pointer-events-none">
        <div class="w-full h-full flex items-end justify-center pb-2">
          <img src="./images/backgrounf image3.jpg" alt="Background" class="object-contain max-h-full">
        </div>
      </div>

      <div class="relative z-10 bg-[#dbddda] rounded-[24px] shadow-lg px-8 py-10 w-[90%] md:w-[460px] max-w-[90%] max-h-[95vh] overflow-y-auto">
        <div class="flex justify-center mb-4">
          <img src="./images/logo.png" alt="SyntraAid Logo" class="w-12 h-12 object-contain" />
        </div>

        <h2 class="text-center text-[#1a1a1a] text-[22px] font-[800] mb-8">
          Let’s Get Started
        </h2>

        <form id="signupForm" onsubmit="return false">
          <div id="okBox" class="hidden mb-4 rounded-[12px] bg-[#eaf8f1] text-[#22A05B] px-4 py-3 text-[13px] font-medium"></div>
          <div id="errBox" class="hidden mb-4 rounded-[12px] bg-red-50 text-red-700 px-4 py-3 text-[13px] font-medium"></div>
          <div class="relative mb-5">
            <span class="absolute inset-y-0 left-4 flex items-center text-gray-500">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </span>
            <input id="name" type="text" placeholder="Name"
              class="w-full pl-12 pr-4 py-3.5 rounded-[14px] bg-[#e6e8e6] border border-gray-400/80 focus:outline-none focus:border-[#2BB673] focus:ring-1 focus:ring-[#2BB673] text-sm text-gray-800 placeholder-gray-500 shadow-sm transition-all" />
          </div>

          <div class="relative mb-5">
            <span class="absolute inset-y-0 left-4 flex items-center text-gray-500">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </span>
            <input id="email" type="email" placeholder="Email"
              class="w-full pl-12 pr-4 py-3.5 rounded-[14px] bg-[#e6e8e6] border border-gray-400/80 focus:outline-none focus:border-[#2BB673] focus:ring-1 focus:ring-[#2BB673] text-sm text-gray-800 placeholder-gray-500 shadow-sm transition-all" />
          </div>

          <div class="relative mb-5">
            <span class="absolute inset-y-0 left-4 flex items-center text-gray-500">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </span>
            <input id="password" type="password" placeholder="Password"
              class="w-full pl-12 pr-12 py-3.5 rounded-[14px] bg-[#e6e8e6] border border-gray-400/80 focus:outline-none focus:border-[#2BB673] focus:ring-1 focus:ring-[#2BB673] text-sm text-gray-800 placeholder-gray-500 shadow-sm transition-all" />
            <span class="absolute inset-y-0 right-4 flex items-center text-gray-400 cursor-pointer hover:text-gray-600 transition-colors">
               <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </span>
          </div>

          <div class="relative mb-5">
            <span class="absolute inset-y-0 left-4 flex items-center text-gray-500">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </span>
            <input id="confirm" type="password" placeholder="Confirm Password"
              class="w-full pl-12 pr-12 py-3.5 rounded-[14px] bg-[#e6e8e6] border border-gray-400/80 focus:outline-none focus:border-[#2BB673] focus:ring-1 focus:ring-[#2BB673] text-sm text-gray-800 placeholder-gray-500 shadow-sm transition-all" />
            <span class="absolute inset-y-0 right-4 flex items-center text-gray-400 cursor-pointer hover:text-gray-600 transition-colors">
               <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </span>
          </div>

          <div class="relative mb-6">
            <select id="role" class="w-full pl-5 pr-10 py-3.5 rounded-[14px] bg-[#e6e8e6] border border-gray-400/80 focus:outline-none focus:border-[#2BB673] focus:ring-1 focus:ring-[#2BB673] text-sm text-gray-500 shadow-sm transition-all appearance-none cursor-pointer">
              <option value="" disabled selected>Account Type (from your invite)</option>
              <option value="admin">NGO Admin</option>
              <option value="coordinator">Coordinator</option>
              <option value="volunteer">Volunteer</option>
              <option value="donor">Donor</option>
            </select>
            <span class="absolute inset-y-0 right-4 flex items-center text-gray-400 pointer-events-none">
               <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </span>
          </div>

          <div class="flex items-center mb-8 pl-1">
            <input type="checkbox" id="terms" class="w-[18px] h-[18px] rounded-sm border-2 border-black text-[#2BB673] focus:ring-[#2BB673] bg-transparent cursor-pointer transition-all">
            <label for="terms" class="ml-3 text-[13px] text-black font-[700] cursor-pointer">
              I Agree to all Terms and Conditions
            </label>
          </div>

          <button id="signupBtn" type="button"
            class="w-full py-3.5 rounded-[16px] bg-[#2BB673] hover:bg-[#22A05B] active:scale-[0.98] transition-all text-black font-[800] text-[15px] tracking-wide shadow-md">
            Sign Up
          </button>

          <div class="flex justify-center mt-6">
            <p class="text-[12px] text-black font-[800]">
              Already have an Account ? 
              <a href="onboarding-login.html" class="text-[#2BB673] hover:text-[#22A05B] underline underline-offset-2 transition-colors ml-1 font-[800]">
                Sign in
              </a>
            </p>
          </div>
        </form>

      </div>
    </div>

  </div>


  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    (function () {
      const ok = document.getElementById("okBox");
      const err = document.getElementById("errBox");
      const showOk = (m) => { ok.textContent = m; ok.classList.remove("hidden"); };
      const showErr = (m) => { err.textContent = m; err.classList.remove("hidden"); };
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      // If an invite token is present, validate it and prefill email + role
      (async function loadInvite() {
        if (!token) {
          showErr("To create an account, open the invitation link sent to you. It contains your invite token.");
          return;
        }
        try {
          const res = await window.Api.get("/auth/invite/" + encodeURIComponent(token));
          const emailEl = document.getElementById("email");
          const roleEl = document.getElementById("role");
          if (res.email) { emailEl.value = res.email; emailEl.readOnly = true; }
          if (res.role) { roleEl.value = res.role; }
          showOk("Invitation verified. Set your password to continue.");
        } catch (e) {
          showErr(e.message || "This invitation link is invalid or has expired.");
        }
      })();

      const btn = document.getElementById("signupBtn");
      btn.addEventListener("click", async () => {
        ok.classList.add("hidden"); err.classList.add("hidden");
        const password = document.getElementById("password").value || "";
        const confirm = document.getElementById("confirm").value || "";
        const terms = document.getElementById("terms").checked;
        if (!token) { showErr("Missing invite token. Please use your invitation link."); return; }
        if (password.length < 8 || !/[A-Z]/.test(password) || !/[0-9]/.test(password)) {
          showErr("Password must be at least 8 characters, with one uppercase letter and one number."); return;
        }
        if (password !== confirm) { showErr("Passwords do not match."); return; }
        if (!terms) { showErr("Please agree to the Terms and Conditions."); return; }
        btn.disabled = true; const t = btn.textContent; btn.textContent = "Creating account...";
        try {
          await window.Api.post("/auth/register", { token, password });
          window.location.href = "Accountpending.html";
        } catch (e) {
          showErr(e.message || "Registration failed. Please try again.");
        } finally { btn.disabled = false; btn.textContent = t; }
      });
    })();
  </script>
</body>

</html>
