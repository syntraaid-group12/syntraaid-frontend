<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - SyntraAid Volunteer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Poppins','system-ui','sans-serif']},colors:{brand:{green:'#2BB673',darkgreen:'#22A05B',lightgreen:'#F2FBF6'}}}}}</script>
  <style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');body{background:#f8f9fa;color:#111827;font-family:'Poppins',sans-serif}.fi{width:100%;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px 14px;font-size:13px}.fi:focus{outline:none;border-color:#2BB673;box-shadow:0 0 0 3px rgba(43,182,115,.12)}</style>
</head>
<body class="antialiased">
  <div id="app"></div>
  <script src="js/config.js"></script><script src="js/auth.js"></script>
  <script src="js/api.js"></script><script src="js/layout.js"></script>
  <script>
    const content = `<div id="wrap"><p class="text-[13px] text-gray-400">Loading profile...</p></div>`;
    Layout.render({ role:"volunteer", active:"profile", title:"My Profile", subtitle:"Your volunteer profile and stats.", content });
    const user=window.Auth.getUser()||{};
    (async function(){
      try{
        let v={};
        try{const res=await window.Api.get("/volunteers/"+user._id);v=res.data||{};}
        catch(e){ if(e.status===404){ Layout.el('wrap').innerHTML='<div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 text-center"><p class="text-[14px] font-[700] mb-2">No profile yet</p><p class="text-[13px] text-gray-500 mb-4">Set up your volunteer profile to get started.</p><a href="volunteer-profile-setup.html" class="inline-block px-5 py-2.5 rounded-full bg-brand-green text-white text-[13px] font-[700]">Set Up Profile</a></div>';return;} throw e; }
        const skills=(v.skills||[]).map(s=>'<span class="text-[11px] px-2 py-0.5 rounded-full bg-[#E8F8F0] text-brand-green">'+Layout.esc(s)+'</span>').join(' ');
        const badges=(v.recognitionBadges||[]).map(b=>'<span class="text-[11px] px-2 py-0.5 rounded-full bg-amber-50 text-amber-600">'+Layout.esc(b)+'</span>').join(' ');
        Layout.el('wrap').innerHTML=
          '<div class="grid grid-cols-1 lg:grid-cols-3 gap-5">'+
          '<div class="lg:col-span-1 bg-white rounded-2xl p-6 shadow-sm border border-gray-100 text-center"><div class="w-16 h-16 rounded-full bg-brand-green text-white flex items-center justify-center text-[22px] font-[800] mx-auto">'+Layout.esc(((v.firstName||'?')[0]||'')+((v.lastName||'')[0]||''))+'</div><h2 class="text-[16px] font-[800] mt-3">'+Layout.esc((v.firstName||'')+' '+(v.lastName||''))+'</h2><p class="text-[12px] text-gray-500">'+Layout.esc(user.email||'')+'</p><a href="volunteer-profile-setup.html" class="inline-block mt-4 px-4 py-2 rounded-full border border-gray-200 text-[12px] font-[600] hover:bg-gray-50">Edit Profile</a></div>'+
          '<div class="lg:col-span-2 space-y-5">'+
          '<div class="grid grid-cols-3 gap-4"><div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100"><p class="text-[12px] text-gray-500">Total Hours</p><p class="text-[20px] font-[800]">'+(v.totalHoursLogged||0)+'h</p></div><div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100"><p class="text-[12px] text-gray-500">Skills</p><p class="text-[20px] font-[800]">'+((v.skills||[]).length)+'</p></div><div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100"><p class="text-[12px] text-gray-500">Badges</p><p class="text-[20px] font-[800]">'+((v.recognitionBadges||[]).length)+'</p></div></div>'+
          '<div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100"><h3 class="text-[14px] font-[700] mb-2">Bio</h3><p class="text-[13px] text-gray-600">'+Layout.esc(v.bio||'No bio yet.')+'</p></div>'+
          '<div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100"><h3 class="text-[14px] font-[700] mb-2">Skills</h3><div class="flex flex-wrap gap-1.5">'+(skills||'<span class="text-[12px] text-gray-400">None</span>')+'</div></div>'+
          '<div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100"><h3 class="text-[14px] font-[700] mb-2">Availability</h3><p class="text-[13px] text-gray-600">'+((v.availabilityDays||[]).join(', ')||'Not set')+'</p></div>'+
          '<div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100"><h3 class="text-[14px] font-[700] mb-2">Recognition Badges</h3><div class="flex flex-wrap gap-1.5">'+(badges||'<span class="text-[12px] text-gray-400">None yet</span>')+'</div></div>'+
          '</div></div>';
      }catch(e){Layout.el('wrap').innerHTML='<p class="text-[13px] text-red-500">'+Layout.esc(e.message)+'</p>';}
    })();
  </script>
</body>
</html>
