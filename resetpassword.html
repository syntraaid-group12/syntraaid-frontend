<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - SyntraAid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>

<body class="h-screen w-full bg-[#f8faf8] overflow-hidden">

  <div class="flex flex-col md:flex-row h-screen w-full">

    <div class="hidden md:block relative md:w-[52%] h-full flex-shrink-0">

      <div class="absolute inset-0 rounded-br-3xl rounded-tr-3xl overflow-hidden">
        <img src="./images/side intro computer.jpg" alt="Side Intro Computer" class="w-full h-full object-cover">
      </div>

      <div class="absolute bottom-10 left-8 z-10 max-w-sm">
        <h1 class="text-black text-4xl font-extrabold leading-tight mb-3">
          Create a New Password
        </h1>
        <p class="text-black text-sm font-bold leading-relaxed">
          Your new password must be different from your previously used password.
        </p>
      </div>

    </div>

    <div class="flex-1 h-full bg-[#f8faf8] relative flex flex-col items-center justify-center overflow-hidden">

      <a href="home.html"
        class="absolute top-6 left-6 z-20 flex items-center gap-1.5 text-[13px] font-[700] text-gray-600 hover:text-[#2BB673] transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
        Back to Home
      </a>

      <div class="absolute bottom-0 right-0 w-full h-64 opacity-20">
        <div class="w-full h-full flex items-end justify-center pb-2">
          <img src="./images/backgrounf image3.jpg" alt="Background">
        </div>
      </div>

      <div class="relative z-10 bg-[#dbddda] rounded-2xl shadow-md px-8 py-10 w-[90%] md:w-[460px] max-w-[90%]">
        <div class="flex justify-center mb-4">
          <img src="./images/logo.png" alt="Logo" class="w-12 h-12 object-contain" />
        </div>

        <h2 class="text-center text-[#1a1a1a] text-xl font-bold mb-8">
          Reset Your Password
        </h2>

        <form id="resetForm" onsubmit="return false">
          <div id="okBox" class="hidden mb-4 rounded-[12px] bg-[#eaf8f1] text-[#22A05B] px-4 py-3 text-[13px] font-medium"></div>
          <div id="errBox" class="hidden mb-4 rounded-[12px] bg-red-50 text-red-700 px-4 py-3 text-[13px] font-medium"></div>

          <div class="relative mb-5">
            <span class="absolute inset-y-0 left-4 flex items-center text-gray-500">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </span>
            <input id="password" type="password" placeholder="Enter New Password"
              class="w-full pl-11 pr-11 py-3 rounded-[14px] bg-[#e6e8e6] border border-gray-300 focus:outline-none focus:border-green-400 text-sm text-gray-700 placeholder-gray-500 shadow-sm" />
          </div>

          <div class="relative mb-8">
            <span class="absolute inset-y-0 left-4 flex items-center text-gray-500">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </span>
            <input id="confirm" type="password" placeholder="Confirm Password"
              class="w-full pl-11 pr-11 py-3 rounded-[14px] bg-[#e6e8e6] border border-gray-300 focus:outline-none focus:border-green-400 text-sm text-gray-700 placeholder-gray-500 shadow-sm" />
          </div>

          <button id="resetBtn" type="button"
            class="w-full py-3.5 rounded-[16px] bg-[#2BB673] hover:bg-[#22A05B] active:scale-[0.98] transition-all text-black font-[800] text-[15px] tracking-wide shadow-md">
            Reset Password
          </button>

          <div class="flex justify-center mt-6">
            <a href="onboarding-login.html" class="text-[#2BB673] hover:text-[#22A05B] underline underline-offset-2 transition-colors ml-1 font-[800] text-[12px]">
              Go back to log in
            </a>
          </div>
        </form>
      </div>
    </div>

  </div>


  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    (function () {
      const ok = document.getElementById("okBox");
      const err = document.getElementById("errBox");
      const btn = document.getElementById("resetBtn");
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");
      if (!token) { err.textContent = "No reset token found in the link. Please use the reset link provided to you."; err.classList.remove("hidden"); }
      btn.addEventListener("click", async () => {
        ok.classList.add("hidden"); err.classList.add("hidden");
        const password = document.getElementById("password").value || "";
        const confirm = document.getElementById("confirm").value || "";
        if (!token) { err.textContent = "Missing reset token."; err.classList.remove("hidden"); return; }
        if (password.length < 8 || !/[A-Z]/.test(password) || !/[0-9]/.test(password)) {
          err.textContent = "Password must be at least 8 characters, with one uppercase letter and one number."; err.classList.remove("hidden"); return;
        }
        if (password !== confirm) { err.textContent = "Passwords do not match."; err.classList.remove("hidden"); return; }
        btn.disabled = true; const t = btn.textContent; btn.textContent = "Resetting...";
        try {
          const res = await window.Api.post("/auth/reset-password", { token, password });
          ok.textContent = ((res && res.message) || "Password reset successful.") + " Redirecting to login...";
          ok.classList.remove("hidden");
          setTimeout(() => window.location.href = "onboarding-login.html", 1800);
        } catch (e) {
          err.textContent = e.message || "Invalid or expired reset token."; err.classList.remove("hidden");
        } finally { btn.disabled = false; btn.textContent = t; }
      });
    })();
  </script>
</body>

</html>
