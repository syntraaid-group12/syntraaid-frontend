<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coordinator Dashboard - SyntraAid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Poppins','system-ui','sans-serif']},colors:{brand:{green:'#2BB673',darkgreen:'#22A05B',lightgreen:'#F2FBF6'}}}}}</script>
  <style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');body{background:#f8f9fa;color:#111827;font-family:'Poppins',sans-serif}::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9999px}</style>
</head>
<body class="antialiased">
  <div id="app"></div>
  <script src="js/config.js"></script><script src="js/auth.js"></script>
  <script src="js/api.js"></script><script src="js/layout.js"></script>
  <script>
    const content = `
      <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-gray-100 flex items-center gap-4">
          <div class="w-11 h-11 rounded-full bg-[#E8F8F0] flex items-center justify-center shrink-0"><svg class="w-5 h-5 text-brand-green" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg></div>
          <div><p class="text-[12px] text-gray-500 font-[500]">Assigned Projects</p><p class="text-[22px] font-[800]" id="k-projects">--</p></div>
        </div>
        <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-gray-100 flex items-center gap-4">
          <div class="w-11 h-11 rounded-full bg-blue-50 flex items-center justify-center shrink-0"><svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M15 7a3 3 0 11-6 0 3 3 0 016 0z"></path></svg></div>
          <div><p class="text-[12px] text-gray-500 font-[500]">Active Volunteers</p><p class="text-[22px] font-[800]" id="k-volunteers">--</p></div>
        </div>
        <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-gray-100 flex items-center gap-4">
          <div class="w-11 h-11 rounded-full bg-purple-50 flex items-center justify-center shrink-0"><svg class="w-5 h-5 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4"></path></svg></div>
          <div><p class="text-[12px] text-gray-500 font-[500]">Tasks Completed</p><p class="text-[22px] font-[800]" id="k-tasks">--</p></div>
        </div>
        <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-gray-100 flex items-center gap-4">
          <div class="w-11 h-11 rounded-full bg-amber-50 flex items-center justify-center shrink-0"><svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M5 19h14a2 2 0 001.84-2.75L13.74 4a2 2 0 00-3.5 0L3.16 16.25A2 2 0 005 19z"></path></svg></div>
          <div><p class="text-[12px] text-gray-500 font-[500]">Blocked Tasks</p><p class="text-[22px] font-[800]" id="k-blocked">--</p></div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
          <h2 class="text-[15px] font-[700] mb-4">Projects by Status</h2>
          <div class="flex items-center justify-center"><svg id="pie-chart" width="140" height="140" viewBox="0 0 140 140"></svg></div>
          <div id="pie-legend" class="mt-4 space-y-1.5 text-[12px]"></div>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 flex flex-col">
          <h2 class="text-[15px] font-[700] mb-4">Task Completion</h2>
          <div class="flex-1 flex flex-col items-center justify-center">
            <p class="text-[40px] font-[800] text-brand-green leading-none" id="task-rate">--</p>
            <p class="text-[12px] text-gray-500 mt-1">Across your projects</p>
            <div class="w-full bg-gray-100 rounded-full h-2.5 mt-4"><div id="task-bar" class="bg-brand-green h-2.5 rounded-full" style="width:0%"></div></div>
          </div>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
          <h2 class="text-[15px] font-[700] mb-4">Blocked Tasks</h2>
          <div id="blocked-list" class="space-y-2"><p class="text-[13px] text-gray-400">Loading...</p></div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
          <h2 class="text-[15px] font-[700] mb-4">My Projects</h2>
          <div id="projects-list" class="space-y-2"><p class="text-[13px] text-gray-400">Loading...</p></div>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
          <h2 class="text-[15px] font-[700] mb-4">Recent Activity</h2>
          <div id="activity-list" class="divide-y divide-gray-50"><p class="text-[13px] text-gray-400 py-3">Loading...</p></div>
        </div>
      </div>
    `;
    Layout.render({ role:"coordinator", active:"dashboard", title:"Coordinator Dashboard", subtitle:"Your projects, volunteers and tasks at a glance.", content });

    const HEALTH={on_track:'bg-[#E8F8F0] text-brand-green',at_risk:'bg-amber-50 text-amber-600',needs_attention:'bg-red-50 text-red-500',completed:'bg-blue-50 text-blue-600'};
    function timeAgo(d){const s=Math.floor((Date.now()-new Date(d).getTime())/1000);if(s<60)return s+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}
    function drawPie(counts){
      const palette={active:'#2BB673',completed:'#2563EB',planning:'#F59E0B',on_hold:'#9CA3AF',cancelled:'#EF4444'};
      const labels={active:'Active',completed:'Completed',planning:'Planning',on_hold:'On Hold',cancelled:'Cancelled'};
      const entries=Object.keys(counts).filter(k=>counts[k]>0);
      const total=entries.reduce((s,k)=>s+counts[k],0);
      const svg=Layout.el('pie-chart'),legend=Layout.el('pie-legend');
      if(!total){svg.innerHTML='<circle cx="70" cy="70" r="55" fill="none" stroke="#eee" stroke-width="18"/>';legend.innerHTML='<p class="text-gray-400">No projects</p>';return;}
      let a0=-Math.PI/2,html='';
      entries.forEach(k=>{const frac=counts[k]/total,a1=a0+frac*2*Math.PI;const x0=70+55*Math.cos(a0),y0=70+55*Math.sin(a0),x1=70+55*Math.cos(a1),y1=70+55*Math.sin(a1);const lg=frac>0.5?1:0;html+='<path d="M70 70 L'+x0.toFixed(2)+' '+y0.toFixed(2)+' A55 55 0 '+lg+' 1 '+x1.toFixed(2)+' '+y1.toFixed(2)+' Z" fill="'+palette[k]+'"/>';a0=a1;});
      html+='<circle cx="70" cy="70" r="32" fill="#fff"/>';svg.innerHTML=html;
      legend.innerHTML=entries.map(k=>'<div class="flex items-center justify-between"><span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full" style="background:'+palette[k]+'"></span>'+labels[k]+'</span><span class="font-[600] text-gray-700">'+counts[k]+'</span></div>').join('');
    }

    (async function(){
      try{
        const res=await window.Api.get("/coordinator/dashboard");
        const d=res.data||{};
        const projects=d.projects||[];
        Layout.el('k-projects').textContent=d.totalProjects!=null?d.totalProjects:projects.length;
        Layout.el('k-volunteers').textContent=projects.reduce((s,p)=>s+(p.volunteerCount||0),0);
        const totC=projects.reduce((s,p)=>s+((p.taskStats&&p.taskStats.completedTasks)||0),0);
        Layout.el('k-tasks').textContent=totC;
        Layout.el('k-blocked').textContent=(d.blockedTasks||[]).length;

        const counts={planning:0,active:0,on_hold:0,completed:0,cancelled:0};
        projects.forEach(p=>{if(counts[p.status]!=null)counts[p.status]++;});
        drawPie(counts);

        // overall completion rate (avg of project completionRate)
        const rate=projects.length?Math.round(projects.reduce((s,p)=>s+(p.completionRate||0),0)/projects.length):0;
        Layout.el('task-rate').textContent=rate+'%';
        Layout.el('task-bar').style.width=rate+'%';

        // blocked tasks
        const bl=Layout.el('blocked-list');
        const blocked=d.blockedTasks||[];
        bl.innerHTML=blocked.length?blocked.map(t=>'<div class="border border-amber-100 bg-amber-50/40 rounded-xl px-4 py-2.5"><p class="text-[13px] font-[600] text-gray-800">'+Layout.esc(t.title)+'</p><p class="text-[11px] text-amber-600">Blocked, needs attention</p></div>').join(''):'<p class="text-[13px] text-gray-400">No blocked tasks. Nice.</p>';

        // projects list
        const pl=Layout.el('projects-list');
        pl.innerHTML=projects.length?projects.map(p=>{const h=p.programHealthStatus||'on_track';return '<a href="coordinator-projects.html" class="flex items-center justify-between border border-gray-100 rounded-xl px-4 py-2.5 hover:bg-gray-50"><span class="text-[13px] font-[600] text-gray-800">'+Layout.esc(p.title)+'</span><span class="text-[11px] px-2 py-0.5 rounded-full '+(HEALTH[h]||'')+' capitalize">'+h.replace(/_/g,' ')+'</span></a>';}).join(''):'<p class="text-[13px] text-gray-400">No projects assigned.</p>';

        // recent activity
        const al=Layout.el('activity-list');
        const acts=d.recentActivity||[];
        al.innerHTML=acts.length?acts.map(a=>'<div class="py-2.5"><p class="text-[13px] font-[600] capitalize">'+Layout.esc((a.activityType||'').replace(/_/g,' '))+'</p><p class="text-[12px] text-gray-500">'+Layout.esc(a.description||'')+'</p></div>').join(''):'<p class="text-[13px] text-gray-400 py-3">No recent activity.</p>';
      }catch(e){
        Layout.el('blocked-list').innerHTML='<p class="text-[13px] text-red-500">'+Layout.esc(e.message)+'</p>';
      }
    })();
  </script>
</body>
</html>
