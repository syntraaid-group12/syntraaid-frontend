<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Received - SyntraAid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Poppins', 'system-ui', 'sans-serif'] },
        colors: { brand: { green: '#2BB673', darkgreen: '#22A05B' } }
      } }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
    body { background-color: #F8FAF8; font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 antialiased">
  <main class="w-full max-w-[460px] flex flex-col items-center text-center">

    <div class="mb-8 flex items-center justify-center w-20 h-20 rounded-full bg-brand-green/10">
      <svg class="w-10 h-10 text-brand-green" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    </div>

    <h1 id="ackTitle" class="text-[30px] font-bold text-[#010A02] mb-4 leading-tight">
      Message Sent
    </h1>

    <p id="ackBody" class="text-[15px] leading-relaxed font-medium text-gray-600 mb-10 px-2">
      Your message has been received. Our team will respond as soon as possible.
    </p>

    <div class="flex flex-col sm:flex-row items-center gap-4">
      <a href="home.html"
        class="px-6 py-2.5 rounded-full bg-brand-green text-white text-[14px] font-semibold hover:bg-brand-darkgreen transition-colors">
        Back to Home
      </a>
      <a href="contact.html"
        class="text-[14px] font-semibold text-brand-green underline underline-offset-[5px] hover:opacity-80 transition-opacity">
        Send another message
      </a>
    </div>
  </main>

  <script>
    (function () {
      const type = new URLSearchParams(location.search).get('type') || 'inquiry';
      const title = document.getElementById('ackTitle');
      const body = document.getElementById('ackBody');
      if (type === 'account') {
        title.textContent = "Access Request Received";
        body.innerHTML = "Thank you for your interest in joining SyntraAid. Your request has been received and is being reviewed by an administrator. If approved, you will receive an invitation with the next steps to set up your account. This usually takes 24 to 48 hours.";
      } else {
        title.textContent = "Message Sent";
        body.innerHTML = "Your message has been received. An administrator will review it and respond to you as soon as possible. Thank you for reaching out to SyntraAid.";
      }
    })();
  </script>
</body>
</html>
