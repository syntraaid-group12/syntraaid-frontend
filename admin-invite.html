<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invite User - SyntraAid Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Poppins','system-ui','sans-serif']},colors:{brand:{green:'#2BB673',darkgreen:'#22A05B',lightgreen:'#F2FBF6'}}}}}</script>
  <style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');body{background:#f8f9fa;color:#111827;font-family:'Poppins',sans-serif}.fi{width:100%;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px 14px;font-size:14px}.fi:focus{outline:none;border-color:#2BB673;box-shadow:0 0 0 3px rgba(43,182,115,.12)}</style>
</head>
<body class="antialiased">
  <div id="app"></div>
  <script src="js/config.js"></script><script src="js/auth.js"></script>
  <script src="js/api.js"></script><script src="js/layout.js"></script>
  <script>
    const content = `
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
        <div class="lg:col-span-1">
          <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 space-y-4">
            <h2 class="text-[15px] font-[700] text-gray-900">Invite a User</h2>
            <div id="okBox" class="hidden rounded-xl bg-[#E8F8F0] text-brand-darkgreen px-4 py-3 text-[13px] font-medium"></div>
            <div id="errBox" class="hidden rounded-xl bg-red-50 text-red-700 px-4 py-3 text-[13px] font-medium"></div>
            <div>
              <label class="block text-[13px] font-[700] text-gray-900 mb-1.5">Email</label>
              <input id="email" type="email" class="fi" placeholder="person@organisation.org">
            </div>
            <div>
              <label class="block text-[13px] font-[700] text-gray-900 mb-1.5">Role</label>
              <select id="role" class="fi">
                <option value="">Select a role</option>
                <option value="admin">NGO Admin</option>
                <option value="coordinator">Coordinator</option>
                <option value="volunteer">Volunteer</option>
                <option value="donor">Donor</option>
              </select>
            </div>
            <button id="inviteBtn" type="button" class="w-full py-3 rounded-full bg-brand-green text-white text-[14px] font-[700] hover:bg-brand-darkgreen transition-colors">Send Invite</button>
            <div id="tokenBox" class="hidden rounded-xl bg-gray-50 border border-gray-100 p-3 text-[12px]">
              <p class="font-[700] text-gray-700 mb-1">Invite link (no email service in MVP, share this):</p>
              <code id="tokenLink" class="block break-all text-brand-green"></code>
            </div>
          </div>
        </div>

        <div class="lg:col-span-2">
          <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
            <h2 class="text-[15px] font-[700] text-gray-900 mb-4">Users &amp; Invite History</h2>
            <div class="overflow-x-auto">
              <table class="w-full text-[13px]">
                <thead><tr class="text-left text-gray-400 border-b border-gray-100">
                  <th class="py-2 font-[600]">Email</th><th class="py-2 font-[600]">Role</th><th class="py-2 font-[600]">Status</th>
                </tr></thead>
                <tbody id="userRows"><tr><td colspan="3" class="py-3 text-gray-400">Loading...</td></tr></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    `;
    Layout.render({ role:"admin", active:"volunteers", title:"Invite User", subtitle:"Invite people and assign their role.", content });

    const ok=Layout.el('okBox'),err=Layout.el('errBox');
    const showOk=m=>{ok.textContent=m;ok.classList.remove('hidden')};
    const showErr=m=>{err.textContent=m;err.classList.remove('hidden')};

    async function loadUsers(){
      try{
        const res=await window.Api.get("/users");
        const rows=Layout.el('userRows');
        const list=res.data||[];
        if(!list.length){rows.innerHTML='<tr><td colspan="3" class="py-3 text-gray-400">No users yet.</td></tr>';return;}
        rows.innerHTML=list.map(u=>{
          const st=u.isActive?'<span class="text-[11px] px-2 py-0.5 rounded-full bg-[#E8F8F0] text-brand-green">Active</span>':'<span class="text-[11px] px-2 py-0.5 rounded-full bg-amber-50 text-amber-600">Pending</span>';
          return '<tr class="border-b border-gray-50"><td class="py-2.5">'+Layout.esc(u.email)+'</td><td class="py-2.5 capitalize">'+Layout.esc(u.role)+'</td><td class="py-2.5">'+st+'</td></tr>';
        }).join('');
      }catch(e){Layout.el('userRows').innerHTML='<tr><td colspan="3" class="py-3 text-red-500">'+Layout.esc(e.message)+'</td></tr>';}
    }
    loadUsers();

    Layout.el('inviteBtn').addEventListener('click', async ()=>{
      ok.classList.add('hidden');err.classList.add('hidden');Layout.el('tokenBox').classList.add('hidden');
      const email=Layout.el('email').value.trim();
      const role=Layout.el('role').value;
      if(!email||!role){showErr('Email and role are required.');return;}
      const btn=Layout.el('inviteBtn');btn.disabled=true;const t=btn.textContent;btn.textContent='Sending...';
      try{
        const res=await window.Api.post("/users/invite",{email,role});
        showOk(res.message||('Invite created for '+email));
        const token=res.data&&res.data.inviteToken;
        if(token){
          const link=window.location.origin+window.location.pathname.replace(/admin-invite\.html$/,'')+'onboarding-signup.html?token='+token;
          Layout.el('tokenLink').textContent=link;
          Layout.el('tokenBox').classList.remove('hidden');
        }
        Layout.el('email').value='';Layout.el('role').value='';
        loadUsers();
      }catch(e){showErr(e.message||'Could not send invite.');}
      finally{btn.disabled=false;btn.textContent=t;}
    });
  </script>
</body>
</html>
