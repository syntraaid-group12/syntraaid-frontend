<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Pending - SyntraAid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              green: '#2BB673',
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
    body {
      background-color: #F8FAF8;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 antialiased">
  <main class="w-full max-w-[440px] flex flex-col items-center text-center">
    <h1 class="text-[32px] font-bold text-[#010A02] mb-4 leading-[140%] tracking-normal">
      Account Pending
    </h1>
    <p class="text-[15px] leading-[140%] font-semibold text-[#010A02] tracking-normal mb-10 px-4">
      Your account is currently being reviewed. This process usually takes 24-48 hours. You'll receive a notification
      once your account has been approved.
    </p>
    <div class="mb-10 flex justify-center w-full">
      <img src="./images/Around_the_world-bro_1-removebg-preview.png" alt="Account pending illustration"
        class="w-[280px] h-[280px] object-contain" />
    </div>
    <p class="text-[15px] leading-snug text-[#1a1a1a] font-medium mb-8 px-6">
      Please ensure your email and submitted information are accurate.
    </p>
    <div class="flex flex-col sm:flex-row items-center gap-4">
      <a href="home.html"
        class="px-6 py-2.5 rounded-full bg-brand-green text-white text-[14px] font-semibold hover:opacity-90 transition-opacity">
        Back to Home
      </a>
      <a href="contact.html"
        class="text-[15px] font-semibold text-brand-green underline decoration-brand-green underline-offset-[5px] decoration-1 hover:opacity-80 transition-opacity rounded-sm">
        Contact support
      </a>
    </div>
  </main>
</body>
</html>
