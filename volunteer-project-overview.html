<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Overview - SyntraAid Volunteer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Poppins','system-ui','sans-serif']},colors:{brand:{green:'#2BB673',darkgreen:'#22A05B',lightgreen:'#F2FBF6'}}}}}</script>
  <style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');body{background:#f8f9fa;color:#111827;font-family:'Poppins',sans-serif}</style>
</head>
<body class="antialiased">
  <div id="app"></div>
  <script src="js/config.js"></script><script src="js/auth.js"></script>
  <script src="js/api.js"></script><script src="js/layout.js"></script>
  <script>
    const pid=new URLSearchParams(location.search).get('id');
    const content = `<div id="wrap"><p class="text-[13px] text-gray-400">Loading project...</p></div>`;
    Layout.render({ role:"volunteer", active:"dashboard", title:"Project Overview", subtitle:"", content });
    const BADGE={not_started:'bg-gray-100 text-gray-500',in_progress:'bg-blue-50 text-blue-600',blocked:'bg-amber-50 text-amber-600',completed:'bg-[#E8F8F0] text-brand-green'};
    if(!pid){Layout.el('wrap').innerHTML='<p class="text-[13px] text-red-500">No project id.</p>';}
    (async function(){
      if(!pid)return;
      try{
        const res=await window.Api.get("/projects/"+pid+"/volunteer-view");
        const d=res.data||{};const p=d.project||{};const tasks=d.tasks||[];
        const ms=(p.milestones||[]);
        Layout.el('wrap').innerHTML=
          '<div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 mb-4"><h2 class="text-[18px] font-[800]">'+Layout.esc(p.title||'')+'</h2><p class="text-[13px] text-gray-600 mt-2">'+Layout.esc(p.description||'')+'</p><p class="text-[12px] text-gray-400 mt-2 capitalize">Status: '+(p.status||'').replace(/_/g,' ')+'</p></div>'+
          '<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">'+
          '<div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100"><h3 class="text-[14px] font-[700] mb-3">Milestones</h3>'+(ms.length?('<div class="space-y-2">'+ms.map(m=>'<div class="flex items-center justify-between border border-gray-100 rounded-xl px-4 py-2.5"><span class="text-[13px] '+(m.isCompleted?'line-through text-gray-400':'text-gray-700')+'">'+Layout.esc(m.title)+'</span><span class="text-[11px] '+(m.isCompleted?'text-brand-green':'text-gray-400')+'">'+(m.isCompleted?'Done':(m.dueDate?new Date(m.dueDate).toLocaleDateString():'-'))+'</span></div>').join('')+'</div>'):'<p class="text-[13px] text-gray-400">No milestones.</p>')+'</div>'+
          '<div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100"><h3 class="text-[14px] font-[700] mb-3">My Tasks in this Project</h3>'+(tasks.length?('<div class="space-y-2">'+tasks.map(t=>'<a href="volunteer-task-detail.html?id='+t._id+'" class="flex items-center justify-between border border-gray-100 rounded-xl px-4 py-2.5 hover:bg-gray-50"><span class="text-[13px] text-gray-700">'+Layout.esc(t.title)+'</span><span class="text-[10px] px-2 py-0.5 rounded-full '+(BADGE[t.status]||'')+' capitalize">'+(t.status||'').replace(/_/g,' ')+'</span></a>').join('')+'</div>'):'<p class="text-[13px] text-gray-400">No tasks assigned to you here.</p>')+'</div>'+
          '</div>';
      }catch(e){Layout.el('wrap').innerHTML='<p class="text-[13px] text-red-500">'+Layout.esc(e.message)+'</p>';}
    })();
  </script>
</body>
</html>
