<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In - SyntraAid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>

<body class="h-screen w-full bg-[#f8faf8] overflow-hidden">

  <div class="flex flex-col md:flex-row h-screen w-full">

    <div class="hidden md:block relative md:w-[50%] lg:w-[52%] h-full flex-shrink-0">

      <div class="absolute inset-0 rounded-br-[40px] rounded-tr-[40px] overflow-hidden">
        <img src="./images/side intro.jpg" alt="SyntraAid Onboarding" class="w-full h-full object-cover">
      </div>

      <div class="absolute bottom-12 left-8 md:left-10 z-10 max-w-[90%] md:max-w-[420px] pr-4">
        <h1 class="text-black text-[36px] md:text-[44px] font-[900] leading-[1.1] mb-4">
          Syntra<span class="text-[#2BB673]">Aid</span> Manage Impact.<br>Inspire Change.
        </h1>
        <p class="text-black text-[14px] md:text-[15px] font-[700] leading-snug">
          Coordinate volunteers, oversee projects, track contributions, and support
          transparent community impact — all in one platform.
        </p>
      </div>

    </div>

    <div class="flex-1 h-full bg-[#f8faf8] relative flex flex-col items-center justify-center overflow-hidden">

      <a href="home.html"
        class="absolute top-6 left-6 z-20 flex items-center gap-1.5 text-[13px] font-[700] text-gray-600 hover:text-[#2BB673] transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
        Back to Home
      </a>

      <div class="absolute bottom-0 right-0 w-full h-64 opacity-20 pointer-events-none">
        <div class="w-full h-full flex items-end justify-center pb-2">
          <img src="./images/backgrounf image3.jpg" alt="Background" class="object-contain max-h-full">
        </div>
      </div>

      <div class="relative z-10 bg-[#dbddda] rounded-[24px] shadow-lg px-8 py-10 w-[90%] md:w-[460px] max-w-[90%] max-h-[95vh] overflow-y-auto">
        <div class="flex justify-center mb-4">
          <img src="./images/logo.png" alt="SyntraAid Logo" class="w-12 h-12 object-contain" />
        </div>

        <h2 class="text-center text-[#1a1a1a] text-[22px] font-[800] mb-8">
          Hello! Welcome Back
        </h2>

        <form id="loginForm" onsubmit="return false">
          <div id="errBox" class="hidden mb-4 rounded-[12px] bg-red-50 text-red-700 px-4 py-3 text-[13px] font-medium"></div>
          <div class="relative mb-5">
            <span class="absolute inset-y-0 left-4 flex items-center text-gray-500">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </span>
            <input id="email" type="email" placeholder="Email"
              class="w-full pl-12 pr-4 py-3.5 rounded-[14px] bg-[#e6e8e6] border border-gray-400/80 focus:outline-none focus:border-[#2BB673] focus:ring-1 focus:ring-[#2BB673] text-sm text-gray-800 placeholder-gray-500 shadow-sm transition-all" />
          </div>

          <div class="relative mb-8">
            <span class="absolute inset-y-0 left-4 flex items-center text-gray-500">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </span>
            <input id="password" type="password" placeholder="Password"
              class="w-full pl-12 pr-12 py-3.5 rounded-[14px] bg-[#e6e8e6] border border-gray-400/80 focus:outline-none focus:border-[#2BB673] focus:ring-1 focus:ring-[#2BB673] text-sm text-gray-800 placeholder-gray-500 shadow-sm transition-all" />
            <span class="absolute inset-y-0 right-4 flex items-center text-gray-400 cursor-pointer hover:text-gray-600 transition-colors">
               <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </span>
          </div>

          <div class="flex justify-end mb-4 -mt-4">
            <a href="forgot-password.html" class="text-[12px] text-[#2BB673] hover:text-[#22A05B] font-[700]">Forgot password?</a>
          </div>
          <button id="loginBtn" type="button"
            class="w-full py-3.5 rounded-[16px] bg-[#2BB673] hover:bg-[#22A05B] active:scale-[0.98] transition-all text-black font-[800] text-[15px] tracking-wide shadow-md">
            Log In
          </button>

          <div class="flex justify-center mt-6">
            <p class="text-[12px] text-black font-[800]">
              Don't have an Account? 
              <a href="contact.html" class="text-[#2BB673] hover:text-[#22A05B] underline underline-offset-2 transition-colors ml-1 font-[800]">
                Sign up
              </a>
            </p>
          </div>
        </form>

      </div>
    </div>

  </div>


  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    if (window.Auth.isLoggedIn()) window.Auth.redirectToDashboard();
    (function () {
      const btn = document.getElementById("loginBtn");
      const err = document.getElementById("errBox");
      const show = (m) => { err.textContent = m; err.classList.remove("hidden"); };
      async function doLogin() {
        err.classList.add("hidden");
        const email = (document.getElementById("email").value || "").trim();
        const password = document.getElementById("password").value || "";
        if (!email || !password) { show("Please enter your email and password."); return; }
        btn.disabled = true; const t = btn.textContent; btn.textContent = "Signing in...";
        try {
          const res = await window.Api.post("/auth/login", { email, password });
          window.Auth.setSession(res.token, res.user);
          window.location.href = window.Auth.dashboardFor(res.user.role);
        } catch (e) {
          if (e.status === 403) { window.location.href = "Accountpending.html"; return; }
          show(e.message || "Invalid email or password.");
        } finally { btn.disabled = false; btn.textContent = t; }
      }
      btn.addEventListener("click", doLogin);
      document.getElementById("password").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
    })();
  </script>
</body>

</html>
