<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - SyntraAid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    body {
      font-family: 'poppins', sans-serif;
    }
  </style>
</head>

<body class="h-screen w-full bg-[#f8faf8] overflow-hidden">

  <div class="flex flex-col md:flex-row h-screen w-full">

    <div class="hidden md:block relative md:w-[52%] h-full flex-shrink-0">

      <div class="absolute inset-0 rounded-br-3xl rounded-tr-3xl overflow-hidden">
        <div class="absolute inset-0">
          <img src="./images/image mask.jpg" alt="Image Mask" class="w-full h-full object-cover">
        </div>
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent"></div>
      </div>

      <div class="absolute bottom-10 left-8 z-10 max-w-sm">
        <h1 class="text-white text-4xl font-extrabold leading-tight mb-3">
          Forgot Password
        </h1>
        <p class="text-white text-sm font-normal leading-relaxed">
          Don't worry, it happens. Enter your registered email address and your administrator will help you reset your password.
        </p>
      </div>

    </div>

    <div class="flex-1 h-full bg-[#f8faf8] relative flex flex-col items-center justify-center overflow-hidden">

      <a href="home.html"
        class="absolute top-6 left-6 z-20 flex items-center gap-1.5 text-[13px] font-[700] text-gray-600 hover:text-[#2BB673] transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
        Back to Home
      </a>

      <div class="absolute bottom-0 right-0 w-full h-64 opacity-20">
        <div class="w-full h-full flex items-end justify-center pb-2">
          <img src="./images/backgrounf image3.jpg" alt="Background">
        </div>
      </div>

      <div class="relative z-10 bg-[#dbddda] rounded-2xl shadow-md px-8 py-10 w-[90%] md:w-[420px] max-w-[90%]">
        <div class="flex justify-center mb-3">
          <div class="w-12 h-12 rounded-full bg-[#dbddda] flex items-center justify-center shadow">
            <img src="./images/logo.png" alt="Logo" class="w-12 h-12 object-contain" />
          </div>
        </div>

        <h2 class="text-center text-[#1a1a1a] text-xl font-bold mb-6">
          Reset Your Password
        </h2>

        <form id="forgotForm" onsubmit="return false">
          <div id="okBox" class="hidden mb-4 rounded-xl bg-[#eaf8f1] text-[#22A05B] px-4 py-3 text-[13px] font-medium"></div>
          <div id="errBox" class="hidden mb-4 rounded-xl bg-red-50 text-red-700 px-4 py-3 text-[13px] font-medium"></div>
          <div class="relative mb-4">
            <span class="absolute inset-y-0 left-4 flex items-center text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </span>
            <input id="email" type="email" placeholder="Email"
              class="w-full pl-10 pr-4 py-3 rounded-xl bg-white border border-transparent focus:outline-none focus:border-green-400 text-sm text-gray-600 placeholder-gray-400 shadow-sm" />
          </div>

          <button id="forgotBtn" type="button"
            class="w-full py-3 rounded-xl bg-[#2BB673] hover:bg-[#35a33c] transition-colors text-black font-semibold text-sm tracking-wide shadow-md">
            Reset Password
          </button>
        </form>

        <div class="flex justify-center mt-5">
          <a href="onboarding-login.html"
            class="text-xs text-[#2BB673] hover:text-green-600 underline underline-offset-2 transition-colors">
            Go back to log in
          </a>
        </div>

      </div>
    </div>

  </div>


  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    (function () {
      const ok = document.getElementById("okBox");
      const err = document.getElementById("errBox");
      const btn = document.getElementById("forgotBtn");
      btn.addEventListener("click", async () => {
        ok.classList.add("hidden"); err.classList.add("hidden");
        const email = (document.getElementById("email").value || "").trim();
        if (!email) { err.textContent = "Please enter your email."; err.classList.remove("hidden"); return; }
        btn.disabled = true; const t = btn.textContent; btn.textContent = "Submitting...";
        try {
          const res = await window.Api.post("/auth/forgot-password", { email });
          ok.textContent = (res && res.message) || "If that account exists, your administrator can help reset your password.";
          ok.classList.remove("hidden");
        } catch (e) {
          err.textContent = e.message || "Something went wrong. Please try again.";
          err.classList.remove("hidden");
        } finally { btn.disabled = false; btn.textContent = t; }
      });
    })();
  </script>
</body>

</html>
