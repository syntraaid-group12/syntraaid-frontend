<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project History - SyntraAid Donor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Poppins','system-ui','sans-serif']},colors:{brand:{green:'#2BB673',darkgreen:'#22A05B',lightgreen:'#F2FBF6'}}}}}</script>
  <style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');body{background:#f8f9fa;color:#111827;font-family:'Poppins',sans-serif}</style>
</head>
<body class="antialiased">
  <div id="app"></div>
  <script src="js/config.js"></script><script src="js/auth.js"></script>
  <script src="js/api.js"></script><script src="js/layout.js"></script>
  <script>
    const pid=new URLSearchParams(location.search).get('id');
    const content = `<div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100"><h2 class="text-[15px] font-[700] mb-4">Activity Timeline</h2><div id="timeline"><p class="text-[13px] text-gray-400">Loading history...</p></div></div>`;
    Layout.render({ role:"donor", active:"projects", title:"Project History", subtitle:"A timeline of significant project activity.", content });
    const user=window.Auth.getUser()||{};
    if(!pid){Layout.el('timeline').innerHTML='<p class="text-[13px] text-red-500">No project id.</p>';}
    (async function(){
      if(!pid)return;
      try{
        const res=await window.Api.get("/donors/"+user._id+"/projects/"+pid+"/history");
        const list=res.data||[];const tl=Layout.el('timeline');
        if(!list.length){tl.innerHTML='<p class="text-[13px] text-gray-400">No activity recorded for this project.</p>';return;}
        tl.innerHTML='<div class="relative pl-6">'+list.map((a,i)=>'<div class="relative pb-5"><span class="absolute -left-6 top-1 w-3 h-3 rounded-full bg-brand-green"></span>'+(i<list.length-1?'<span class="absolute -left-[19px] top-4 bottom-0 w-px bg-gray-200"></span>':'')+'<p class="text-[13px] font-[600] capitalize">'+Layout.esc((a.activityType||'').replace(/_/g,' '))+'</p><p class="text-[12px] text-gray-500">'+Layout.esc(a.description||'')+'</p><p class="text-[11px] text-gray-400 mt-0.5">'+new Date(a.createdAt).toLocaleString()+'</p></div>').join('')+'</div>';
      }catch(e){Layout.el('timeline').innerHTML='<p class="text-[13px] text-red-500">'+Layout.esc(e.message)+'</p>';}
    })();
  </script>
</body>
</html>
