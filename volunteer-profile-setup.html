<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Setup - SyntraAid Volunteer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Poppins','system-ui','sans-serif']},colors:{brand:{green:'#2BB673',darkgreen:'#22A05B',lightgreen:'#F2FBF6'}}}}}</script>
  <style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');body{background:#f8f9fa;color:#111827;font-family:'Poppins',sans-serif}.fi{width:100%;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px 14px;font-size:13px}.fi:focus{outline:none;border-color:#2BB673;box-shadow:0 0 0 3px rgba(43,182,115,.12)}.day.on{background:#2BB673;color:#fff;border-color:#2BB673}</style>
</head>
<body class="antialiased">
  <div id="app"></div>
  <script src="js/config.js"></script><script src="js/auth.js"></script>
  <script src="js/api.js"></script><script src="js/layout.js"></script>
  <script>
    const content = `
      <div class="max-w-2xl">
        <div id="okBox" class="hidden mb-4 rounded-xl bg-[#E8F8F0] text-brand-darkgreen px-4 py-3 text-[13px]"></div>
        <div id="errBox" class="hidden mb-4 rounded-xl bg-red-50 text-red-700 px-4 py-3 text-[13px]"></div>

        <div class="flex items-center gap-2 mb-5">
          <div class="flex items-center gap-2"><span id="dot1" class="w-7 h-7 rounded-full bg-brand-green text-white flex items-center justify-center text-[12px] font-[700]">1</span><span class="text-[13px] font-[600]">Basics</span></div>
          <div class="flex-1 h-px bg-gray-200"></div>
          <div class="flex items-center gap-2"><span id="dot2" class="w-7 h-7 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center text-[12px] font-[700]">2</span><span class="text-[13px] font-[600] text-gray-500">Skills &amp; Availability</span></div>
        </div>

        <div id="step1" class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div><label class="block text-[13px] font-[700] mb-1.5">First Name *</label><input id="firstName" class="fi"></div>
            <div><label class="block text-[13px] font-[700] mb-1.5">Last Name *</label><input id="lastName" class="fi"></div>
          </div>
          <div><label class="block text-[13px] font-[700] mb-1.5">Bio</label><textarea id="bio" rows="3" class="fi" placeholder="Tell us about yourself"></textarea></div>
          <div class="flex justify-end"><button id="next" type="button" class="px-6 py-3 rounded-full bg-brand-green text-white text-[14px] font-[700] hover:bg-brand-darkgreen">Next</button></div>
        </div>

        <div id="step2" class="hidden bg-white rounded-2xl p-6 shadow-sm border border-gray-100 space-y-4">
          <div><label class="block text-[13px] font-[700] mb-1.5">Skills (comma separated)</label><input id="skills" class="fi" placeholder="teaching, first aid, logistics"></div>
          <div><label class="block text-[13px] font-[700] mb-2">Availability Days</label>
            <div class="flex flex-wrap gap-2" id="days">
              ${['MON','TUE','WED','THU','FRI','SAT','SUN'].map(d=>'<button type="button" data-d="'+d+'" class="day px-3 py-1.5 rounded-full border border-gray-200 text-[12px] font-[600]">'+d+'</button>').join('')}
            </div>
          </div>
          <div class="flex justify-between"><button id="back" type="button" class="px-6 py-3 rounded-full border border-gray-200 text-gray-700 text-[14px] font-[600] hover:bg-gray-50">Back</button><button id="save" type="button" class="px-6 py-3 rounded-full bg-brand-green text-white text-[14px] font-[700] hover:bg-brand-darkgreen">Save Profile</button></div>
        </div>
      </div>
    `;
    Layout.render({ role:"volunteer", active:"profile", title:"Profile Setup", subtitle:"Set up your volunteer profile in two steps.", content });

    const user=window.Auth.getUser()||{};
    const ok=Layout.el('okBox'),err=Layout.el('errBox');
    let exists=false;
    // prefill if profile exists
    (async function(){try{const res=await window.Api.get("/volunteers/"+user._id);const v=res.data||{};exists=true;
      Layout.el('firstName').value=v.firstName||'';Layout.el('lastName').value=v.lastName||'';Layout.el('bio').value=v.bio||'';
      Layout.el('skills').value=(v.skills||[]).join(', ');
      (v.availabilityDays||[]).forEach(d=>{const b=document.querySelector('.day[data-d="'+d+'"]');if(b)b.classList.add('on');});
    }catch(e){}})();

    Layout.el('next').addEventListener('click',()=>{
      if(!Layout.el('firstName').value.trim()||!Layout.el('lastName').value.trim()){err.textContent='First and last name are required.';err.classList.remove('hidden');return;}
      err.classList.add('hidden');Layout.el('step1').classList.add('hidden');Layout.el('step2').classList.remove('hidden');
      Layout.el('dot2').className='w-7 h-7 rounded-full bg-brand-green text-white flex items-center justify-center text-[12px] font-[700]';
    });
    Layout.el('back').addEventListener('click',()=>{Layout.el('step2').classList.add('hidden');Layout.el('step1').classList.remove('hidden');});
    document.addEventListener('click',e=>{const b=e.target.closest('.day');if(b)b.classList.toggle('on');});

    Layout.el('save').addEventListener('click', async ()=>{
      ok.classList.add('hidden');err.classList.add('hidden');
      const payload={
        firstName:Layout.el('firstName').value.trim(),
        lastName:Layout.el('lastName').value.trim(),
        bio:Layout.el('bio').value.trim(),
        skills:Layout.el('skills').value.split(',').map(s=>s.trim()).filter(Boolean),
        availabilityDays:Array.prototype.map.call(document.querySelectorAll('.day.on'),b=>b.dataset.d),
      };
      const btn=Layout.el('save');btn.disabled=true;const t=btn.textContent;btn.textContent='Saving...';
      try{
        if(exists){ await window.Api.put("/volunteers/"+user._id+"/profile",payload); }
        else { await window.Api.post("/volunteers/"+user._id+"/profile",payload); }
        ok.textContent='Profile saved. Redirecting...';ok.classList.remove('hidden');
        setTimeout(()=>window.location.href='volunteer-profile.html',1200);
      }catch(e){err.textContent=e.message||'Could not save profile.';err.classList.remove('hidden');}
      finally{btn.disabled=false;btn.textContent=t;}
    });
  </script>
</body>
</html>
